<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}رفيق{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <strong class="brand">رفيق · Rafeeq</strong>
    <nav>
      {% for item in nav %}
      <a href="{{ item.path }}" class="{{ 'on' if item.key == active }}">{{ item.ar }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
