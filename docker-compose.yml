services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rafeeq
      POSTGRES_PASSWORD: rafeeq
      POSTGRES_DB: rafeeq
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env          # LLM keys for the teacher assistant
        required: false
    environment:
      DATABASE_URL: postgresql://rafeeq:rafeeq@db:5432/rafeeq
      M4_DATABASE_URL: sqlite:////app/storage/m4.db   # quiz history and mastery, inside the persisted storage volume
    volumes:
      # accounts, rooms, files, the search index, M3 study data and generated lessons survive a rebuild
      - appstorage:/app/storage
      - appdata:/app/data
      - appoutputs:/app/outputs
      - hfcache:/root/.cache/huggingface      # the embedder is downloaded once, not on every new container
    depends_on:
      - db
volumes:
  dbdata:
  appstorage:
  appdata:
  appoutputs:
  hfcache:
